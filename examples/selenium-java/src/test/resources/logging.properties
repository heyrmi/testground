handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %4$s: %5$s%n

# Selenium probes for a DevTools implementation matching the installed browser
# and warns once per driver when it finds none. Nothing in this suite uses CDP
# and the warning appears for every test, so it buries whatever the run was
# actually trying to tell you. Silenced deliberately rather than tolerated: if
# a test ever does reach for DevTools, raise this back to WARNING first.
org.openqa.selenium.devtools.level = SEVERE
org.openqa.selenium.chromium.level = SEVERE
