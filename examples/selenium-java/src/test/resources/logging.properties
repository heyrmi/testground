handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %4$s: %5$s%n

# Selenium warns once per driver that its newest typed DevTools bindings trail
# the installed browser, and falls back to the previous version. Four lines per
# test buries whatever the run was trying to say. Nothing here uses the typed
# bindings; DownloadsTest reaches for DevTools through executeCdpCommand, which
# sends raw CDP and is unaffected by the version this warns about.
org.openqa.selenium.devtools.level = SEVERE
org.openqa.selenium.chromium.level = SEVERE
