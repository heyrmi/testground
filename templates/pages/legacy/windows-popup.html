{{define "layout"}}{{template "layout-legacy" .}}{{end}}

{{define "content" -}}
<h2 data-testid="popup-target">Popup: {{.Data.Kind}}</h2>
<p class="text-muted">
  This is a different browsing context. Locators created against the opener never see it.
</p>
<p><span data-testid="popup-kind">{{.Data.Kind}}</span></p>
{{- end}}

{{define "scripts" -}}
<script>
  jQuery(function ($) {
    var kind = {{.Data.Kind}};

    if (kind === 'closing') {
      window.setTimeout(function () { window.close(); }, 2000);
    }

    if (kind === 'writer') {
      // Reaching back into the opener. Same origin, so this is allowed, and it
      // changes a page no locator here is pointing at.
      window.setTimeout(function () {
        if (window.opener && !window.opener.closed) {
          window.opener.document
            .querySelector('[data-testid="from-popup"]')
            .textContent = 'written by the popup';
        }
        window.close();
      }, 500);
    }
  });
</script>
{{- end}}
