name: Release

on:
  push:
    tags: ['v*']
  # Manual trigger, because a tag push is an event and events can be lost.
  # During a GitHub Actions outage the pushes for two tags were dropped and
  # never produced a run at all, which left the only recovery path as deleting
  # and re-pushing a public tag. This makes that unnecessary next time.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.7.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      # Built fresh rather than trusted from the tree, so a release can never
      # ship a bundle nobody rebuilt.
      - name: Build the frontend
        run: npm ci && npm run build
        working-directory: web/app

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
