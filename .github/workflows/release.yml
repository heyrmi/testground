name: Release

on:
  push:
    tags: ['v*']
  # Manual trigger, because a tag push is an event and events can be lost.
  # During a GitHub Actions outage the pushes for two tags were dropped and
  # never produced a run at all, which left the only recovery path as deleting
  # and re-pushing a public tag. This makes that unnecessary next time.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.7.0'
        required: true

permissions:
  contents: write
  # Pushing the container images to ghcr.io. Without this the archives publish
  # and the docker pipe fails at the end, leaving a release whose notes promise
  # an image that is not there.
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      # Built fresh rather than trusted from the tree, so a release can never
      # ship a bundle nobody rebuilt.
      - name: Build the frontend
        run: npm ci && npm run build
        working-directory: web/app

      # The arm64 image is built on an amd64 runner. That needs no emulation
      # here, because the stage GoReleaser targets only copies an
      # already-cross-compiled binary and never executes an instruction. Add a
      # RUN to that stage and this becomes a QEMU setup step as well.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Homebrew tap is a separate repository, and GITHUB_TOKEN cannot
          # write outside this one. An absent secret expands to an empty string
          # rather than an error, which .goreleaser.yaml reads as "skip the
          # cask" -- so a repository without the tap set up still gets its
          # archives, checksums and images instead of a failed release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
