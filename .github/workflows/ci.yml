name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '24'

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

      # .goreleaser.yaml runs `go mod tidy` as a before-hook, so an untidy
      # go.mod leaves the release run staring at a dirty tree and aborting.
      # A tag is the worst place to find that out.
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      # The release configuration is otherwise only exercised by pushing a tag,
      # which is public and awkward to take back.
      - name: Validate the release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check

  bundle:
    name: Frontend bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - run: npm ci
        working-directory: web/app
      - run: npm run build
        working-directory: web/app

      # The build output is committed so `go install` yields a working binary.
      # If it drifts, users of that path get a stale UI without any warning.
      - name: Verify the committed bundle matches a fresh build
        run: |
          if ! git diff --quiet -- web/app/dist; then
            echo "The committed bundle is stale. Run 'make web' and commit web/app/dist."
            git diff --stat -- web/app/dist
            exit 1
          fi

  e2e:
    name: Playwright reference suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: examples/playwright-ts/package-lock.json

      - run: npm ci
        working-directory: examples/playwright-ts
      - run: npx playwright install --with-deps chromium
        working-directory: examples/playwright-ts
      - run: npx tsc --noEmit
        working-directory: examples/playwright-ts
      - run: npm test
        working-directory: examples/playwright-ts

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: examples/playwright-ts/test-results/
          retention-days: 7

  selenium:
    name: Selenium reference suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unlike the Playwright suite, which starts the server itself through
      # playwright.config.ts, Maven has no equivalent hook. The server is
      # started here and waited for, rather than slept on: a fixed sleep is the
      # exact mistake half these challenges exist to teach.
      - name: Start the playground
        run: |
          go run ./cmd/playground serve --addr 127.0.0.1:7373 --log-level info >playground.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7373/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "the playground never became healthy"
          exit 1

      # Selenium Manager fetches a driver matching the runner's Chrome.
      - run: mvn -B test
        working-directory: examples/selenium-java

      # The request log answers the question a browser-side failure cannot: a
      # form that was never submitted and one that was submitted and refused
      # look identical from the page, and differ by one line here.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: selenium-failure
          path: |
            examples/selenium-java/target/surefire-reports/
            playground.log
          retention-days: 7
